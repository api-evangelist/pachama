aid: pachama
name: Pachama
description: >-
  Pachama is a San Francisco–based climate technology company founded in 2018
  that built a satellite- and machine-learning-powered platform for monitoring,
  reporting, and verification (MRV) of nature-based carbon projects —
  including forest conservation, reforestation, afforestation, and improved
  forest management. Pachama combined satellite imagery, LiDAR, remote
  sensing, and deep-learning models to measure aboveground biomass, detect
  deforestation, and track project performance against verified baselines,
  surfacing that intelligence through an online marketplace where corporate
  buyers (including Microsoft, Shopify, Salesforce, Flexport.org, Mercado
  Libre, Boom Supersonic, and Nespresso) could discover and purchase
  high-integrity carbon credits. In November 2025, Pachama was acquired by
  Carbon Direct, and its proprietary digital MRV platform and forest-carbon
  science team were folded into Carbon Direct's science-backed carbon
  management offering; pachama.com now redirects to carbon-direct.com.
  Throughout its life as an independent company Pachama operated a buyer
  marketplace and discussed plans for a partner API to embed project
  selection and retirement data into third-party products, but never shipped
  a public, self-service developer API, SDK, or open OpenAPI specification —
  its GitHub organization contains only forks and archived internal tooling.
